<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marktstand">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<title>Marktstand</title>
<style>
:root{
  --bg:#f4f3ef; --card:#fff; --ink:#1d2421; --muted:#6b736f; --line:#e4e2dc;
  --accent:#2f6b4f; --accent-soft:#e3efe8; --warn:#a3620a; --warn-soft:#fbf0dc;
  --danger:#a33a2a; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 0;border-bottom:1px solid var(--line)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;max-width:640px;margin:0 auto}
.datebar .nav{width:44px;height:44px;border-radius:12px;font-size:22px;display:grid;place-items:center}
.datebar .nav:active{background:var(--line)}
.datebar .mid{text-align:center;flex:1}
.datebar .d{font-weight:700;font-size:19px}
.datebar .sub{font-size:13px;color:var(--muted)}
.datebar .sub button{color:var(--accent);font-weight:600;margin-left:6px}
.tabs{display:flex;max-width:640px;margin:8px auto 0;padding:0 14px}
.tabs button{flex:1;padding:12px 0 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.banner{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:#5d3b06;font-size:14px}
.banner.ok{background:var(--accent-soft);color:#1d4a35}
.step{background:var(--card);border-radius:var(--radius);margin-top:12px;border:1px solid var(--line);overflow:hidden}
.step.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--line);color:var(--muted)}
.step.active .num{background:var(--accent);color:#fff}
.step.done .num{background:var(--accent-soft);color:var(--accent)}
.step-t{flex:1;min-width:0}
.step-t b{display:block;font-size:16px}
.step-t span{display:block;font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:13px}
.step-b{padding:0 14px 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.list>.check:first-child,.list>.row:first-child{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #b9bdb9;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
.check.on .box{background:var(--accent);border-color:var(--accent)}
.check.on .lbl{color:var(--muted);text-decoration:line-through}
.lbl{flex:1;min-width:0}
.qty{font-weight:700;white-space:nowrap}
.qty small{font-weight:400;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.warn{font-size:12.5px;color:var(--warn);display:block}
.info{margin-top:8px;border-radius:10px;background:var(--bg);font-size:14px}
.info>button{width:100%;text-align:left;padding:10px 12px;color:var(--accent);font-weight:600;font-size:14px}
.info ul{margin:0;padding:0 12px 12px 30px}
.info li{margin:3px 0}
.note{font-size:14px;color:var(--muted);padding:4px 0 8px}
input.num-in{width:78px;padding:9px 10px;border:1px solid #cfd2cd;border-radius:10px;text-align:right;background:#fff}
input.num-in:focus,input.txt:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input.txt,select{width:100%;padding:9px 10px;border:1px solid #cfd2cd;border-radius:10px;background:#fff}
.unit{width:96px;font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;text-align:center;margin-top:12px}
.btn:disabled{background:#c9ccc7;color:#fff;cursor:default}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.small{display:inline-block;width:auto;padding:8px 12px;margin:0;font-size:14px}
.link{color:var(--accent);font-weight:600;font-size:14px}
.link.danger{color:var(--danger)}
.temp{display:flex;align-items:center;gap:10px;padding:6px 0 10px 38px}
.temp .msg{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:12px}
.card h2{font-size:17px;margin:0 0 2px}
.card h3{font-size:15px;margin:14px 0 4px}
.card>.hint{margin-bottom:6px}
.sec-h{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.done-card{background:var(--accent-soft);border-radius:var(--radius);padding:16px;margin-top:14px}
.done-card b{font-size:17px}
.prod{border-top:1px solid var(--line);padding:12px 0}
.prod:first-of-type{border-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.soll{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px 8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.soll input{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:8px 12px;border-radius:99px;border:1px solid #cfd2cd;font-weight:600;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2421;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.qty.warn{display:inline;color:var(--warn);font-size:inherit}
.banner.bad{background:#f8e4e0;color:#6b2316}
input.num-in.bad{border-color:var(--danger);background:#fdf0ee;outline-color:var(--danger)}
.qbtn{font-weight:700;font-size:18px;white-space:nowrap;padding:6px 8px;margin:-6px -8px;border-radius:8px;background:var(--bg)}
.oddmsg{font-size:13px;color:var(--warn);padding:0 0 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pack-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.list>.pack-row:first-child{border-top:0}
.pack-row .check{border-top:0;flex:1}
.tabs .gear{flex:0 0 52px;font-size:18px}
.pagehead{padding:16px 2px 0}.pagehead h1{font-size:22px;margin:0 0 4px}
.sub{display:block;font-size:13px;color:var(--ink);margin-top:2px;line-height:1.35}
.sub.quiet{color:var(--muted)}
.sub.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.qty.big{font-size:18px;min-width:28px;text-align:right}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.sbtn{width:36px;height:36px;border-radius:10px;background:var(--bg);font-size:20px;font-weight:700;line-height:1}
.sbtn[disabled]{opacity:.35}
.sval{min-width:30px;text-align:center;font-weight:700;font-size:18px}
.stepper.on .sval{color:var(--muted)}
.check.on .lbl .warn{display:inline-block;text-decoration:none}
.pen{font-size:12px;color:var(--muted);margin-left:4px;display:inline-block}
.subhead{font-weight:700;font-size:14px;padding:6px 0 4px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid #cfd2cd;font-size:18px;font-weight:700;background:#fff}
.stepper button:disabled{opacity:.35}
.stepper span{min-width:22px;text-align:center;font-weight:700}
textarea.txt{font:inherit}
.sec-h h2{flex:1}
.sec-h>span{white-space:nowrap;display:flex;align-items:center;gap:8px}
.eqbox{background:var(--bg);border-radius:10px;padding:8px 12px 10px;margin:0 0 8px 38px;font-size:14px}
.eqbox ul{margin:0;padding-left:18px}.eqbox li{margin:2px 0}.quiet{color:var(--muted)}
.prodrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.ico{width:34px;height:22px;flex:none;color:var(--muted)}
.eqname{display:inline-flex;align-items:center;gap:8px}
.dims{color:var(--muted);font-size:12px;white-space:nowrap}
.equl{list-style:none;padding:0 !important;margin:0}
.equl li{display:flex;align-items:center;gap:8px;padding:3px 0}
.equl .n{min-width:18px;text-align:right}
.footer{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:26px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.flink{font-size:14px;color:var(--muted);padding:8px 4px}
.back{color:var(--accent);font-weight:600;font-size:15px;padding:6px 0;margin-bottom:6px}
.teamcard{display:flex;align-items:flex-start;flex-wrap:wrap;gap:4px 10px;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.teamline{flex:1;min-width:0;text-align:left;font-size:14px;display:flex;gap:8px;align-items:center}
.teamline .tl{flex:1;min-width:0}
.teamcard>.list{flex-basis:100%}
.weather{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:4px}
.wnum{font-size:22px;font-weight:700;color:var(--accent);white-space:nowrap}
.prodedit{background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.sollrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sollrow label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.sollrow input{width:100%}
.kasse{margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.callout{margin-top:12px;padding:12px 14px;border-radius:12px;background:#eef3f8;color:#1f3447;font-size:14px;border-left:4px solid #6f93b6}
.empty{padding:6px 0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="datebar">
    <button class="nav" id="prev" aria-label="Vorheriger Tag">‹</button>
    <div class="mid"><div class="d" id="dlabel"></div><div class="sub" id="dsub"></div></div>
    <button class="nav" id="next" aria-label="Nächster Tag">›</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-t="og">OG</button><button data-t="mm">MM</button><button data-t="lager">Lager</button>
  </nav>
</header>
<main class="wrap" id="app"></main>
<script>
"use strict";
/* ---------- Grunddaten ---------- */
const HUTS = { og:{ short:"OG", name:"OG-Cheese-Hütte" }, mm:{ short:"MM", name:"M&M-Hütte" } };
const SUPPLIERS = {
  moellers:{ name:"Möllers", orderBtn:"Als bestellt markieren", open:"bestellt", recvBtn:"Lieferung bestätigen" },
  baecker:{ name:"Bäcker", orderBtn:"Als bestellt markieren", open:"bestellt", recvBtn:"Lieferung bestätigen" },
  kueche:{ name:"Küche", orderBtn:"Nachkochen beauftragen", open:"in Produktion", recvBtn:"Fertig, eingelagert" }
};
const AUFBAU = [
  "Alles abgeladen und Ware eingeräumt",
  "Equipment an seinem Platz, Soßen in den Squeeze-Flaschen",
  "Grillplatte und Kartenterminal bereit"
];
const AUFBAU_SCHRITTE = [
  "Ware abladen und gekühlt einräumen",
  "Licht an, Theke und Hütte herrichten",
  "Arbeitsplätze einrichten, Equipment an seinen Platz",
  "GN-Behälter mit Ware füllen, Soßenflaschen auffüllen",
  "Grillplatte anheizen, SumUp-Terminal an und verbunden",
  "Eine Probeportion machen und ausstellen"
];

const SCHLIESSEN = [
  "Hütte geschlossen, Grill und Geräte aus",
  "Putzplan erledigt"
];
const NACHT = [
  "Ware über Nacht versorgt (siehe oben)",
  "Brot ins Auto, auch wenn es kalt genug ist",
  "SumUp-Terminal, Bargeld und Zettel an den Lead",
  "Graue Geschirrbox mit in die Küche"
];
const DEFAULT_EXTRAS = ["Feuerlöscher","GN 1/2","Deckel GN 1/2","GN 1/6","Squeeze-Flasche","Servietten","Essensschalen","Soßenbehälter","Küchentücher","Mülltüten","Blaue Rolle"];
const COLD_LIMIT = 7;
function coldRule(hut,low){
  const cold=low!=null&&low<=COLD_LIMIT;
  if(low==null) return hut==="mm"?"Bis 7 °C bleibt die Ware in der Hütte, sonst in die Kühltruhe hinter dem Apple-Crumble-Stand.":"Bis 7 °C bleibt die Ware in der Hütte, sonst in den Kühlschrank, Rest mit in die Küche.";
  if(cold) return "Die Ware kann in der Hütte bleiben, das Brot kommt trotzdem ins Auto.";
  return hut==="mm"?"Ware in die Kühltruhe hinter dem Apple-Crumble-Stand.":"Ware in den Kühlschrank, was nicht reinpasst, mit in die Küche.";
}
// Extras: Einträge "gear:<key>" verweisen auf den Equipment-Katalog, alles andere ist freier Verbrauchsartikel
function coldShort(hut,low){ if(low==null) return "Kühlregel siehe Schritt 4"; if(low<=COLD_LIMIT) return "Darf in der Hütte bleiben"; return hut==="mm"?"In die Kühltruhe hinter Apple Crumble":"In den Kühlschrank, Rest in die Küche"; }
function extrasRaw(){ const e=S.config.extras; return Array.isArray(e)?e:DEFAULT_EXTRAS; }
function exName(id){ return String(id).startsWith("gear:")?gearName(String(id).slice(5)):String(id); }
function extrasList(){ return extrasRaw().map(id=>({id,name:exName(id),key:ekey(String(id))})); }
function ekey(name){ return name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x"; }
function extrasFrom(hut,date){ const y=dayDoc(hut,addDays(date,-1)); const ex=y.extras||{}; return Object.entries(ex).filter(([,e])=>e&&e.qty>0).map(([k,e])=>({...e,key:k,name:e.ref?exName(e.ref):e.name})); }
/* ---------- Bildchen fürs Equipment (eigene SVGs, keine Fremdbilder) ---------- */
const GN = { "1/1":[53,32.5], "2/3":[35.4,32.5], "1/2":[26.5,32.5], "1/3":[17.6,32.5], "2/4":[53,16.2], "1/4":[26.5,16.2], "2/8":[13.2,32.5], "1/6":[17.6,16.2], "1/9":[17.6,10.8] };
function gnOf(name){ const m=/GN\s*(\d)\s*\/\s*(\d+)/i.exec(name); if(!m) return null; const k=m[1]+"/"+m[2]; return GN[k]?{k,d:GN[k]}:null; }
function gnDims(name){ const g=gnOf(name); if(!g) return ""; const [w,hh]=g.d; const a=Math.max(w,hh), b=Math.min(w,hh); return `${String(a).replace(".",",")} × ${String(b).replace(".",",")} cm`; }
const SVGNS="http://www.w3.org/2000/svg";
function svgIcon(inner){ const sv=document.createElementNS(SVGNS,"svg"); sv.setAttribute("viewBox","0 0 40 26"); sv.setAttribute("class","ico"); sv.setAttribute("aria-hidden","true"); sv.innerHTML=inner; return sv; }
const F='fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"';
const L='fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
function iconFor(name){
  const n=name.toLowerCase(); const g=gnOf(name);
  if(g&&!/deckel/.test(n)){ const sc=36/53; const [w,hh]=g.d;
    return svgIcon(`<rect x="2" y="2" width="36" height="22.1" rx="2" fill="none" stroke="var(--muted)" stroke-opacity=".45" stroke-dasharray="2 2"/><rect x="2" y="2" width="${(w*sc).toFixed(1)}" height="${(hh*sc).toFixed(1)}" rx="2" ${F}/>`); }
  if(/deckel/.test(n)) return svgIcon(`<rect x="4" y="12" width="32" height="7" rx="3" ${F}/><rect x="16" y="7" width="8" height="5" rx="2" ${F}/>`);
  if(/gn|behälter/.test(n)) return svgIcon(`<path d="M6 7h28l-2.5 14a2 2 0 0 1-2 1.6H10.5a2 2 0 0 1-2-1.6z" ${F}/>`);
  if(/squeeze|flasche/.test(n)) return svgIcon(`<rect x="14" y="9" width="12" height="15" rx="3" ${F}/><path d="M17 9l1.5-4h3L23 9" ${F}/><path d="M20 5V2" ${L}/>`);
  if(/messer/.test(n)) return svgIcon(`<rect x="3" y="14" width="11" height="5" rx="2.5" ${F}/><path d="M14 14h20c2 0 2.5 3 0 4.5L14 19z" ${F}/>`);
  if(/zange/.test(n)) return svgIcon(`<path d="M5 13c8-1 18-4 30-8M5 13c8 1 18 4 30 8" ${L}/><circle cx="6" cy="13" r="2.5" ${F}/>`);
  if(/spachtel/.test(n)) return svgIcon(`<rect x="3" y="11" width="13" height="4" rx="2" ${F}/><rect x="17" y="6" width="19" height="14" rx="3" ${F}/>`);
  if(/löffel|loeffel/.test(n)) return svgIcon(`<rect x="3" y="11" width="18" height="4" rx="2" ${F}/><ellipse cx="29" cy="13" rx="8" ry="6" ${F}/>`);
  if(/blech|brett/.test(n)) return svgIcon(`<rect x="3" y="7" width="34" height="12" rx="3" ${F}/><rect x="7" y="10" width="26" height="6" rx="2" fill="none" stroke="var(--accent)" stroke-opacity=".5"/>`);
  if(/box|kiste/.test(n)) return svgIcon(`<rect x="5" y="9" width="30" height="14" rx="3" ${F}/><rect x="3" y="5" width="34" height="5" rx="2" ${F}/>`);
  if(/tuch|tücher/.test(n)) return svgIcon(`<path d="M7 5h26v16H7z" ${F}/><path d="M7 11h26" ${L}/>`);
  if(/löscher/.test(n)) return svgIcon(`<rect x="14" y="8" width="12" height="16" rx="5" ${F}/><path d="M18 8V5h6l6-2" ${L}/>`);
  return svgIcon(`<rect x="12" y="5" width="16" height="16" rx="4" ${F}/>`);
}
function eqLabel(name,note){ const d=gnDims(name); return h("span",{class:"eqname"},iconFor(name),h("span",{},name,(d||note)?h("span",{class:"dims",style:"display:block"},[d,note].filter(Boolean).join(" · ")):null)); }
function canStay(name){ return /gn|deckel|squeeze|flasche|behälter/i.test(name)&&!/tagsüber/i.test(name); }
// Equipment: zentraler Katalog (gear/<key>), Hütten verweisen nur per key + Anzahl. Umbenennen ändert den Namen überall, Einträge bleiben verknüpft.
function gearName(key){ const g=S.gear[key]; return g&&g.name?g.name:key; }
function eqList(hut){ return ((S.equipment[hut]&&S.equipment[hut].items)||[]).map(e=>e.key?{key:e.key,name:gearName(e.key),qty:Number(e.qty)||1}:{name:e.name,qty:Number(e.qty)||1,key:ekey(e.name)}); }
function eqNeed(hut,date){ const y=dayDoc(hut,addDays(date,-1)); const st=y.stay||{}; return eqList(hut).map(e=>{const stay=Math.min(e.qty,Number(st[e.key])||0); return {...e,stay,need:e.qty-stay};}); }
function noteFrom(hut,date){ const y=dayDoc(hut,addDays(date,-1)); return (y.nextNote||"").trim(); }
const PUTZPLAN = [
  "Grillplatte abschaben und reinigen",
  "Arbeitsflächen mit Neutralreiniger abwischen und desinfizieren",
  "Squeeze-Flaschen, Zangen, Messer und Löffel in die graue Box",
  "Übrige Ware in frische Behälter umgefüllt und abgedeckt",
  "Theke und Scheiben mit Glasreiniger putzen",
  "Boden fegen und wischen",
  "Müll raus, neue Mülltüte einlegen",
  "Lappen und Schwämme ausgespült oder in die Wäsche"
];
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];

/* ---------- Zustand ---------- */
const S = { gear:{}, items:{}, days:{}, orders:{}, equipment:{}, config:{}, weather:{}, shifts:{}, team:{}, ready:false, err:null, slow:false };
let db = null;
const ui = { sub:null, lastActive:{}, scrollTo:null, editPack:null, draft:{}, tab:"og", date:todayStr(), open:{}, counting:null, recv:{}, delArm:null, newProd:{ hut:{ og:false, mm:false } } };

/* ---------- Hilfen ---------- */
// Arbeitstag wechselt erst um 5 Uhr, damit Einträge nach Mitternacht noch zum Markttag zählen
function todayStr(){ const d=new Date(Date.now()-5*3600*1000); return ymd(d); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return ymd(d); }
function nowISO(){ return new Date().toISOString(); }
function fmt(n){ return (Math.round(n*10)/10).toLocaleString("de-DE").replace("-","−"); }
function parseNum(v){ if(v==null) return null; const t=String(v).trim().replace(",","."); if(t==="") return null; const n=Number(t); return isFinite(n)?n:null; }
function weekendDays(){ const w=S.config.weekendDays; return Array.isArray(w)?w:[6,0]; }
function isWeekend(date){ return weekendDays().includes(parseD(date).getDay()); }
function h(tag, props, ...kids){
  const el=document.createElement(tag);
  if(props) for(const k in props){ const v=props[k]; if(v==null||v===false) continue;
    if(k==="class") el.className=v; else if(k==="text") el.textContent=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="value") el.value=v; else el.setAttribute(k, v===true?"":v); }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c instanceof Node?c:document.createTextNode(String(c))); }
  return el;
}
let toastT;
function toast(msg){ document.querySelectorAll(".toast").forEach(e=>e.remove()); const t=h("div",{class:"toast",text:msg}); document.body.append(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }

/* ---------- Berechnungen ---------- */
function itemList(){ return Object.entries(S.items).map(([k,v])=>({key:k,...v})).sort((a,b)=>(a.sort??999)-(b.sort??999)||String(a.name).localeCompare(String(b.name),"de")); }
function itemsFor(hut){ return itemList().filter(i=>i.soll&&i.soll[hut]); }
function sollOf(item,hut,date){ const s=item.soll&&item.soll[hut]; if(!s) return 0; const v=isWeekend(date)?s.we:s.wt; return Number(v)||0; }
function dayDoc(hut,date){ return S.days[date+"_"+hut]||{}; }
function hasBestand(doc){ return !!doc.bestand && Object.values(doc.bestand).some(v=>v!=null); }
function sollMissing(item,hut,date){ const s=item.soll&&item.soll[hut]; if(!s) return false; const v=isWeekend(date)?s.we:s.wt; return v==null||v===""; }
// letzter eingetragener Bestand vor diesem Tag (deckt Ruhetage und vergessene Abende ab)
function lastBestand(hut,date){
  let best=null;
  for(const [id,d] of Object.entries(S.days)){
    if(!id.endsWith("_"+hut)) continue; const dd=id.slice(0,10);
    if(dd<date&&hasBestand(d)&&(!best||dd>best.date)) best={date:dd,doc:d};
  }
  return best;
}
function packList(hut,date){
  const lb=lastBestand(hut,date);
  const lines=[], missing=[];
  for(const it of itemsFor(hut)){
    if(sollMissing(it,hut,date)) missing.push(it);
    const soll=sollOf(it,hut,date);
    const v=lb?lb.doc.bestand[it.key]:null;
    const rest=v==null?0:Number(v)||0;
    const need=Math.max(0, Math.ceil((soll-rest)*10)/10);
    if(need>0) lines.push({item:it, need, noCount:!!lb&&v==null});
  }
  return {lines, hasPrev:!!lb, prevDate:lb&&lb.date, missing};
}
function missingSoll(it){ return Object.values(it.soll||{}).some(s=>s&&(s.wt==null||s.wt===""||s.we==null||s.we==="")); }
function bestandLimit(item,hut){ const s=item.soll&&item.soll[hut]; if(!s) return 0; return Math.max(Number(s.wt)||0,Number(s.we)||0)*2; }
function implausible(item,hut,doc){ const v=doc.bestand&&doc.bestand[item.key]; if(v==null) return false; const lim=bestandLimit(item,hut); return lim>0&&v>lim&&!(doc.bestandOk&&doc.bestandOk[item.key]===v); }
function overdue(o){ return o.status==="open"&&o.date&&o.date<addDays(todayStr(),-1); }
function packedQty(hut,date,key){ const p=dayDoc(hut,date).pack; const e=p&&p[key]; return e&&Number(e.qty)>0?Number(e.qty):0; }
function isPacked(hut,date,key){ const p=dayDoc(hut,date).pack; const e=p&&p[key]; return !!e&&(e.done===true||(e.done!==false&&Number(e.qty)>0)); }
// Vorschlag zum Mitnehmen: Soll-Bedarf, aber nicht mehr als laut Lager da ist (nur wenn das Lager gezählt wurde)
function packSuggest(item,need){ if(!item.count) return need; return Math.max(0,Math.min(need,Math.floor(stockOf(item.key)*10)/10)); }
function stockOf(key){
  const it=S.items[key]||{}; const c=it.count; const t0=(c&&c.at)||""; let s=c?Number(c.qty)||0:0;
  for(const o of Object.values(S.orders)) if(o.status==="received"&&(o.receivedAt||"")>t0&&o.received) s+=Number(o.received[key])||0;
  for(const d of Object.values(S.days)) if(d.pack&&d.pack[key]){ const e=d.pack[key]; if(Number(e.qty)>0&&(e.at||"")>t0) s-=Number(e.qty); }
  return s;
}
function openQty(key){ let s=0; for(const o of Object.values(S.orders)) if(o.status==="open"&&o.lines) s+=Number(o.lines[key])||0; return s; }
function neverCounted(){ return itemList().every(i=>!i.count); }
function restock(date){
  const groups={}; const d1=addDays(date,1), d2=addDays(date,2);
  const pending={};
  const today={};
  for(const hut of Object.keys(HUTS)) for(const l of packList(hut,date).lines){ const k=l.item.key;
    if(!isPacked(hut,date,k)) pending[k]=(pending[k]||0)+l.need;
    else { const miss=l.need-packedQty(hut,date,k); if(miss>0) today[k]=(today[k]||0)+miss; } }
  for(const it of itemList()){
    let target=0; for(const hut of Object.keys(HUTS)) target+=sollOf(it,hut,d1)+sollOf(it,hut,d2);
    const miss=today[it.key]||0;
    if(!target&&!miss) continue;
    const stock=Math.max(0,stockOf(it.key)), open=openQty(it.key), pend=pending[it.key]||0;
    const short=target+miss-(stock+open-pend);
    if(short>0){ const sup=SUPPLIERS[it.supplier]?it.supplier:"moellers"; (groups[sup]=groups[sup]||[]).push({item:it, qty:Math.ceil(short), stock, open, pend, target, miss}); }
  }
  return groups;
}
function stepState(hut,date){
  const doc=dayDoc(hut,date); const pl=packList(hut,date);
  const ex=extrasFrom(hut,date);
  const packDone=pl.lines.every(l=>isPacked(hut,date,l.item.key))&&!!doc.equip&&!!doc.terminal&&ex.every(e=>doc.packExtra&&doc.packExtra[e.key]);
  const aufDone=AUFBAU.every((_,i)=>doc.aufbau&&doc.aufbau["c"+i]);
  const closeDone=SCHLIESSEN.every((_,i)=>doc.schliessen&&doc.schliessen["c"+i]);
  const nightDone=NACHT.every((_,i)=>doc.nacht&&doc.nacht["c"+i]);
  const items=itemsFor(hut); const filled=items.filter(i=>doc.bestand&&doc.bestand[i.key]!=null).length;
  const odd=items.filter(i=>implausible(i,hut,doc));
  const bestDone=items.length>0&&filled===items.length&&odd.length===0&&!!doc.bestandDone;
  const closed=!!doc.closed;
  return {doc,pl,packDone,aufDone,closeDone,nightDone,bestDone,filled,total:items.length,closed,odd};
}

/* ---------- Schreiben ---------- */
let failed=[]; let noRights=false;
function writeDoc(path, patch){
  if(!db){ toast("Keine Verbindung zur Datenbank, nichts gespeichert"); return Promise.resolve(); }
  const p=db.doc(path).update(patch);
  p.catch(e=>{ console.error(e); if(e&&e.code==="invalid_argument"){ noRights=true; toast("Keine Schreibrechte"); } else { failed.push({path,patch}); } render(); });
  return Promise.resolve();
}
async function retryFailed(){ const list=failed; failed=[]; render(); for(const f of list) writeDoc(f.path,f.patch); }
// Zahlenfeld: prüft Eingabe, markiert Ungültiges rot statt still zu verwerfen
function numInput(label,value,onValid,extra){
  return h("input",Object.assign({class:"num-in",type:"text",inputmode:"decimal","aria-label":label,value:value==null?"":fmt(value),
    onchange:e=>{ const raw=e.target.value.trim(); const n=parseNum(raw);
      if(raw!==""&&(n==null||n<0)){ e.target.classList.add("bad"); toast("Bitte nur Zahlen ab 0 eintragen"); return; }
      e.target.classList.remove("bad"); onValid(n); },
    onkeydown:e=>{ if(e.key==="Enter"){ e.preventDefault(); e.target.blur(); } }},extra||{}));
}
function patchDay(hut,date,patch){ const id=date+"_"+hut; return writeDoc("days/"+id, patch, !!S.days[id]); }
function patchItem(key,patch){ return writeDoc("items/"+key, patch, !!S.items[key]); }

/* ---------- Rendern ---------- */
let pending=false;
function render(){
  const a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA")&&a.closest("#app")){ pending=true; return; }
  pending=false;
  const d=parseD(ui.date);
  document.getElementById("dlabel").textContent=d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
  const sub=document.getElementById("dsub"); sub.textContent="";
  const isToday=ui.date===todayStr();
  sub.append((isToday?"Heute · ":"")+(isWeekend(ui.date)?"Wochenende":"Wochentag"));
  if(!isToday) sub.append(h("button",{onclick:()=>{ui.date=todayStr();render();}},"Zu heute"));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===ui.tab));
  document.querySelector(".datebar").style.display=ui.sub||ui.plan?"none":"flex";
  const app=document.getElementById("app"); const y=window.scrollY; app.textContent="";
  if(!db&&S.ready) app.append(h("div",{class:"banner bad"},S.noTeam?"Bitte die App einmal über den Team-Link aus der WhatsApp-Gruppe öffnen. Danach merkt sich das Handy den Zugang.":"Keine Verbindung zur Datenbank. Bitte Internet prüfen und neu laden."));
  else if(S.err) app.append(h("div",{class:"banner"},"Die Daten sind gerade nicht erreichbar. Bitte später nochmal öffnen."));
  else if(!S.ready) app.append(h("div",{class:"banner ok"},"Lade Daten …"));
  else if(S.slow) app.append(h("div",{class:"banner"},"Kein Netz? Du siehst den zuletzt geladenen Stand. Einträge werden gespeichert, sobald wieder Netz da ist."));
  if(failed.length) app.append(h("div",{class:"banner bad"},`${failed.length} Eingabe${failed.length===1?"":"n"} nicht gespeichert, vermutlich kein Netz. `,h("button",{class:"link",onclick:retryFailed},"Nochmal senden")));
  if(noRights) app.append(h("div",{class:"banner bad"},"Du kannst hier nur lesen. Bitte beim Chef Schreibrechte (Contributor) holen."));
  if(!ui.sub&&!ui.plan&&ui.tab!=="lager"&&ui.date!==todayStr()){
    const past=ui.date<todayStr();
    app.append(h("div",{class:"banner"},h("b",{},past?"Achtung, das ist ein vergangener Tag. ":"Achtung, das ist ein Tag in der Zukunft. "),"Einträge landen bei diesem Datum. ",h("button",{class:"link",onclick:()=>{ui.date=todayStr();render();}},"Zu heute")));
  }
  if(ui.sub) app.append(renderSub()); else if(ui.plan) app.append(renderPlan()); else if(ui.tab==="lager") app.append(renderLager()); else app.append(renderHut(ui.tab));
  window.scrollTo(0,y);
  if(ui.scrollTo){ const el=document.getElementById(ui.scrollTo); ui.scrollTo=null; if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),60); }
}
document.addEventListener("focusout",()=>setTimeout(()=>{ if(pending) render(); },0));

function step(idx, title, meta, done, active, body, summary){
  const key=ui.tab+":"+ui.date+":"+idx; const ov=ui.open[key];
  const open=(ov&&ov.done===done)?ov.v:active;
  return h("section",{class:"step"+(active?" active":"")+(done?" done":""),id:"step-"+idx},
    h("button",{class:"step-h","aria-expanded":open?"true":"false",onclick:()=>{ui.open[key]={v:!open,done};render();}},
      h("span",{class:"num"},done?"✓":String(idx+1)),
      h("span",{class:"step-t"},h("b",{},title),h("span",{},done&&!open?summary:meta)),
      h("span",{class:"chev"},open?"▲":"▼")),
    open?h("div",{class:"step-b"},body()):null);
}
function checkRow(on, label, onclick, extra){
  return h("button",{class:"check"+(on?" on":""),onclick, role:"checkbox","aria-checked":on?"true":"false"},
    h("span",{class:"box"},on?"✓":""), h("span",{class:"lbl"},label), extra||null);
}
function infoBox(id,title,items){
  const key="info:"+id; const open=!!ui.open[key];
  return h("div",{class:"info"},
    h("button",{onclick:(e)=>{e.stopPropagation();ui.open[key]=!open;render();}},(open?"▾ ":"▸ ")+title),
    open?h("ul",{},items.map(t=>h("li",{},t))):null);
}

function renderHut(hut){
  const date=ui.date; const st=stepState(hut,date); const doc=st.doc;
  const frag=document.createDocumentFragment();
  const order=[st.packDone,st.aufDone,st.closeDone,st.bestDone,st.closed];
  const activeIdx=st.closed?-1:order.findIndex(x=>!x);
  // nächsten Schritt ins Bild holen, sobald einer fertig wird
  const ak=hut+":"+date; if(ui.lastActive[ak]!==undefined&&ui.lastActive[ak]!==activeIdx&&activeIdx>=0) ui.scrollTo="step-"+activeIdx; ui.lastActive[ak]=activeIdx;

  frag.append(renderTeam(hut,date));
  if(st.closed){
    const next=packList(hut,addDays(date,1)).lines.length;
    frag.append(h("div",{class:"done-card"},h("b",{},"Feierabend, Tag abgeschlossen"),
      h("div",{class:"hint"},next?`Morgen packen: ${next} Lebensmittel-Position${next===1?"":"en"} für ${HUTS[hut].short}.`:"Morgen muss keine Ware nachgepackt werden."),
      h("button",{class:"link",style:"margin-top:8px",onclick:()=>patchDay(hut,date,{closed:false})},"Wieder öffnen")));
  }

  // 1 Packen
  frag.append(step(0,"Packen in der Küche","14:00 · Plankgasse",st.packDone,activeIdx===0,()=>{
    const out=[];
    const note=noteFrom(hut,date);
    if(note) out.push(h("div",{class:"banner",style:"margin:0 0 10px"},h("b",{},"Notiz von gestern: "),note));
    const yday=addDays(date,-1);
    if(!st.pl.hasPrev) out.push(h("div",{class:"note"},"Noch kein Abendbestand eingetragen, deshalb volle Soll-Menge."));
    else if(st.pl.prevDate!==yday) out.push(h("div",{class:"note"},"Gestern kein Bestand eingetragen. Gerechnet wird mit dem vom "+parseD(st.pl.prevDate).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"numeric"})));
    if(st.pl.missing.length) out.push(h("div",{class:"note",style:"color:var(--warn)"},"Ohne Soll-Wert, wird nicht gepackt: "+st.pl.missing.map(i=>i.name).join(", ")+"."));
    const list=h("div",{class:"list"});
    list.append(h("div",{class:"subhead"},"Ware"));
    if(!st.pl.lines.length) list.append(h("div",{class:"empty"},"Alles noch genug in der Hütte."));
    for(const l of st.pl.lines){
      const k=l.item.key; const on=isPacked(hut,date,k); const pq=packedQty(hut,date,k);
      const dk=date+hut+k; const stock=Math.max(0,stockOf(k));
      const val=on?pq:(ui.draft[dk]!=null?ui.draft[dk]:packSuggest(l.item,l.need));
      const sub=[];
      if(!on&&l.item.count&&stock<l.need) sub.push(h("span",{class:"warn"},stock>0?`Im Lager nur ${fmt(stock)} statt ${fmt(l.need)}`:`Im Lager nichts da, gebraucht ${fmt(l.need)}`));
      else if(!on&&val!==l.need) sub.push(h("span",{class:"warn"},`Gebraucht ${fmt(l.need)}`));
      if(l.noCount&&!on) sub.push(h("span",{class:"warn"},"Abends nicht gezählt, volle Soll-Menge"));
      if(on&&pq<l.need) sub.push(h("span",{class:"warn"},`${fmt(l.need-pq)} zu wenig, steht im Nachschub`));
      if(on&&pq>l.need) sub.push(h("span",{class:"sub quiet"},`${fmt(pq-l.need)} mehr als gebraucht`));
      const setVal=n=>{ n=Math.max(0,Math.round(n*10)/10);
        if(on) patchDay(hut,date,{pack:{[k]:{qty:n,done:true,at:nowISO()}}}); else { ui.draft[dk]=n; render(); } };
      const stepper=h("div",{class:"stepper"+(on?" on":"")},
        h("button",{class:"sbtn","aria-label":"weniger",disabled:val<=0?"":null,onclick:()=>setVal(val-1)},"−"),
        h("span",{class:"sval"},fmt(val)),
        h("button",{class:"sbtn","aria-label":"mehr",onclick:()=>setVal(val+1)},"+"));
      list.append(h("div",{class:"pack-row"},
        checkRow(on,h("span",{},l.item.name,h("span",{class:"sub quiet"},l.item.unit),sub),()=>{
          if(on){ ui.draft[dk]=pq; patchDay(hut,date,{pack:{[k]:{qty:0,done:false,at:nowISO()}}}); }
          else { delete ui.draft[dk]; patchDay(hut,date,{pack:{[k]:{qty:val,done:true,at:nowISO()}}}); } }),
        stepper));
    }
    const ex=extrasFrom(hut,date);
    if(ex.length) list.append(h("div",{class:"subhead",style:"margin-top:10px"},"Extra, gestern angefordert"));
    for(const e of ex){ const k=e.key; const on=!!(doc.packExtra&&doc.packExtra[k]);
      list.append(h("div",{class:"pack-row"},checkRow(on,eqLabel(e.name),()=>patchDay(hut,date,{packExtra:{[k]:!on}})),h("span",{class:"qty big"},fmt(e.qty)))); }
    list.append(h("div",{class:"subhead",style:"margin-top:10px"},"Equipment & Kasse"));
    const eq=eqNeed(hut,date); const take=eq.filter(e=>e.need>0); const stayed=eq.filter(e=>e.stay>0);
    const nTake=take.reduce((x,e)=>x+e.need,0), nStay=stayed.reduce((x,e)=>x+e.stay,0);
    const eqOpen=!!ui.open["eq:"+hut];
    list.append(h("div",{class:"pack-row"},
      checkRow(!!doc.equip,h("span",{},"Gespültes & Equipment",h("span",{class:"sub quiet"},`${nTake} Teile mitnehmen`+(nStay?` · ${nStay} schon am Stand`:""))),()=>patchDay(hut,date,{equip:!doc.equip})),
      h("button",{class:"link",style:"padding:8px 0 8px 8px","aria-expanded":eqOpen?"true":"false",onclick:()=>{ui.open["eq:"+hut]=!eqOpen;render();}},eqOpen?"Zuklappen":"Liste")));
    if(eqOpen) list.append(h("div",{class:"eqbox"},
      h("div",{class:"subhead"},"Mitnehmen"),
      take.length?h("ul",{class:"equl"},take.map(e=>h("li",{},h("b",{class:"n"},String(e.need)),eqLabel(e.name,e.stay?`${e.stay} schon am Stand`:null)))):h("div",{class:"empty"},"Nichts, alles am Stand."),
      stayed.length?[h("div",{class:"subhead",style:"margin-top:8px"},"Schon am Stand"),h("ul",{class:"equl quiet"},stayed.map(e=>h("li",{},h("b",{class:"n"},String(e.stay)),eqLabel(e.name))))]:null));
    list.append(checkRow(!!doc.terminal,"SumUp-Terminal & Kasse vom Küchentisch",()=>patchDay(hut,date,{terminal:!doc.terminal})));
    out.push(list);
    if(st.pl.lines.length) out.push(h("div",{class:"hint",style:"margin-top:8px"},"Mit − und + die Menge anpassen, wenn du mehr oder weniger mitnimmst. Dann abhaken."));
    return out;
  },`${st.pl.lines.length} Positionen, Equipment und Kasse dabei`));

  // 2 Aufbau
  frag.append(step(1,"Aufbau am Markt","14:45 Ankunft · 15:00 öffnen",st.aufDone,activeIdx===1,()=>[
    h("div",{class:"list"},AUFBAU.map((t,i)=>{const on=!!(doc.aufbau&&doc.aufbau["c"+i]); return checkRow(on,t,()=>patchDay(hut,date,{aufbau:{["c"+i]:!on}}));})),
    infoBox("aufbau","So wird aufgebaut",AUFBAU_SCHRITTE)
  ],"Hütte steht, gute Schicht!"));

  frag.append(h("div",{class:"callout"},
    h("b",{},"Während der Schicht: wir sind cashless"),
    h("div",{},"Bitte mit Karte oder Handy am SumUp-Terminal zahlen lassen. Bar nur, wenn jemand passend zahlt, Wechselgeld haben wir keins."),
    h("div",{style:"margin-top:4px"},"Bargeld bitte immer auf dem Zettel notieren, damit der Lead abends den Überblick hat.")));

  // 3 Schließen & Putzen
  frag.append(step(2,"Schließen & putzen","Schichtende",st.closeDone,activeIdx===2,()=>{
    const list=h("div",{class:"list"});
    SCHLIESSEN.forEach((t,i)=>{
      const on=!!(doc.schliessen&&doc.schliessen["c"+i]);
      list.append(checkRow(on,t,()=>patchDay(hut,date,{schliessen:{["c"+i]:!on}})));
      if(i===1) list.append(infoBox("putz","Putzplan anzeigen",PUTZPLAN));
    });
    return list;
  },"Hütte zu und sauber"));

  // 4 Für morgen erfassen: alles, was am Handy eingetragen wird und die Packliste von morgen bestimmt
  frag.append(step(3,"Bestand & Bedarf für morgen","Was bleibt da, was fehlt morgen",st.bestDone,activeIdx===3,()=>{
    const items=itemsFor(hut);
    const out=[];
    const w=S.weather[date]; const low=w&&w.low!=null?Number(w.low):null;
    out.push(h("div",{class:"weather",style:"margin-bottom:10px"},h("span",{class:"wnum"},low!=null?`${fmt(low)} °C`:"? °C"),h("span",{},h("b",{},low!=null?"Heute Nacht. ":"Nachttemperatur fehlt. "),coldRule(hut,low))));
    const list=h("div",{class:"list"});
    list.append(h("div",{class:"subhead"},"Lebensmittel in der Hütte",h("span",{class:"hint",style:"font-weight:400"},` · ${st.filled} von ${st.total} · Pflicht`)));
    list.append(h("div",{class:"hint",style:"margin:0 0 6px"},"Alles zählen, was übrig ist, auch das Brot. Nur volle Packungen, Angebrochenes zählt nicht."));
    for(const it of items){

    h("div",{class:"hint",style:"margin-top:10px"},"Oder ganz neu:"),

/* ---------- Daten (Firebase / Firestore, ohne Login) ---------- */
// Team-Code aus dem Link (?t=...) wird auf dem Gerät gemerkt, damit die App vom Homescreen ohne Link startet
function teamCode(){
  let t=null; try{ t=new URLSearchParams(location.search).get("t"); }catch(e){}
  try{ if(t) localStorage.setItem("team",t); else t=localStorage.getItem("team"); }catch(e){}
  return t&&/^[A-Za-z0-9_-]{8,64}$/.test(t)?t:null;
}
const mapCode=c=>c==="permission-denied"?"invalid_argument":(c==="unavailable"?"unavailable":c||"unavailable");
function wrapDoc(r){ return {
  get:async()=>{ const x=await r.get(); return {exists:x.exists,data:()=>x.data()}; },
  set:d=>r.set(d), update:d=>r.set(d,{merge:true}), delete:()=>r.delete(),
  onSnapshot:(n,e)=>r.onSnapshot(x=>n({exists:x.exists,data:()=>x.data(),metadata:x.metadata}),err=>e&&e({code:mapCode(err.code),message:err.message}))
};}
async function initDb(){
  if(window.__TESTDB) return window.__TESTDB;
  const T=teamCode(); if(!T||!window.firebase||!window.FIREBASE_CONFIG) return null;
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const fs=firebase.firestore();
  try{ await fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  await firebase.auth().signInAnonymously();
  const base=fs.collection("teams").doc(T);
  window.__hk={fs,base};
  const wrapErr=e=>err=>e&&e({code:mapCode(err.code),message:err.message});
  return {
    doc:p=>{ const [c,d]=p.split("/"); return wrapDoc(base.collection(c).doc(d)); },
    collection:c=>({
      onSnapshot:(n,e)=>base.collection(c).onSnapshot(x=>n({docs:x.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()})),metadata:x.metadata}),wrapErr(e)),
      add:d=>base.collection(c).add(d)
    })
  };
}
(async()=>{
  try{ db=await initDb(); }catch(e){ console.error(e); db=null; S.err=e; }
  if(!db){ S.ready=true; S.noTeam=!teamCode(); render(); return; }
  const need={items:false,days:false,orders:false,equipment:false,config:false};
  const timer=setTimeout(()=>{ if(!S.ready){ S.ready=true; S.slow=true; render(); } },6000);
  const mark=(k)=>{ need[k]=true; if(Object.values(need).every(Boolean)&&!S.ready){ S.ready=true; S.slow=false; clearTimeout(timer);} render(); };
  const onErr=e=>{ console.error(e); S.err=e; clearTimeout(timer); render(); };
  const toMap=snap=>{ const m={}; snap.docs.forEach(d=>{ if(d.exists) m[d.id]=d.data(); }); return m; };
  db.collection("items").onSnapshot(s=>{S.items=toMap(s);mark("items");},onErr);
  db.collection("days").onSnapshot(s=>{S.days=toMap(s);mark("days");},onErr);
  db.collection("orders").onSnapshot(s=>{S.orders=toMap(s);mark("orders");},onErr);
  db.collection("equipment").onSnapshot(s=>{S.equipment=toMap(s);mark("equipment");},onErr);
  db.collection("gear").onSnapshot(s=>{S.gear=toMap(s);render();},e=>console.error(e));
  db.collection("weather").onSnapshot(s=>{S.weather=toMap(s);render();},e=>console.error(e));
  db.collection("shifts").onSnapshot(s=>{S.shifts=toMap(s);render();},e=>console.error(e));
  db.doc("team/people").onSnapshot(s=>{S.team=s.exists?s.data():{};render();},e=>console.error(e));
  db.doc("config/main").onSnapshot(s=>{S.config=s.exists?Object.assign({exists:true},s.data()):{};mark("config");},onErr);
})();
